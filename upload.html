<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeMory - Upload Meme</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-protected="true">

    <div class="app-container" style="display: flex; flex-direction: column; justify-content: space-between; min-height: 95vh; max-width: 480px; margin: 0 auto; padding: 15px; box-sizing: border-box;">

        <div style="width: 100%;">

            <!-- Header Bar -->
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px;">

                <a href="home.html">
                    <img src="images/logo.png" alt="MemeMory Logo" style="height: 26px; width: auto; display: block;">
                </a>

                <a href="home.html" style="text-decoration: none; font-size: 13px; color: #666; font-weight: 500;">
                    Cancel
                </a>

            </div>

            <!-- Upload Form -->
            <form id="uploadForm" style="display: flex; flex-direction: column; gap: 15px;">

                <!-- Image -->
                <div style="display: flex; flex-direction: column; gap: 5px;">

                    <label style="font-size: 13px; font-weight: 600; color: #333;">
                        Select Meme Image (PNG/JPG up to 5MB)
                    </label>

                    <input type="file" id="memeImage" accept="image/png, image/jpeg" required style="padding: 10px; border: 1px dashed #007bff; border-radius: 6px; background-color: #f8f9fa; font-size: 13px;">

                </div>

                <!-- Title -->
                <div style="display: flex; flex-direction: column; gap: 5px;">

                    <label style="font-size: 13px; font-weight: 600; color: #333;">
                        Title
                    </label>

                    <input type="text" id="memeTitle" name="title" placeholder="e.g., Pointer in C++" required style="padding: 9px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; outline: none;">

                </div>

                <!-- Course Tag -->
                <div style="display: flex; flex-direction: column; gap: 5px;">

                    <label style="font-size: 13px; font-weight: 600; color: #333;">
                        Course Tag
                    </label>

                    <input type="text" id="memeCourse" name="course" placeholder="e.g., IT320" required style="padding: 9px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; outline: none;">

                </div>

                <!-- Description -->
                <div style="display: flex; flex-direction: column; gap: 5px;">

                    <label style="font-size: 13px; font-weight: 600; color: #333;">
                        Short Description (Optional)
                    </label>

                    <textarea id="memeDesc" name="description" placeholder="Add a brief explanation..." rows="3" style="padding: 9px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; outline: none; resize: none;"></textarea>

                </div>
    
                <!-- Display upload success and error messages -->
                <p id="uploadStatus" role="status" aria-live="polite"
                   style="display: none; font-size: 13px; margin: 0;">
                </p>

                <button type="submit" style="margin-top: 5px; padding: 11px; background-color: #007bff; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;">
                    Publish Meme
                </button>

            </form>

        </div>

        <!-- Bottom Navigation -->
        <div style="border-top: 1px solid #eee; padding-top: 12px; display: flex; justify-content: space-around; width: 100%; align-items: center; background-color: #fff; margin-top: 20px;">

            <a href="home.html" title="Home" style="text-decoration: none; padding: 6px 12px; display: flex; align-items: center;">
                <img src="images/home-icon.png" alt="Home" style="width: 22px; height: 22px; display: block; opacity: 0.6;">
            </a>

            <a href="upload.html" title="Create" style="text-decoration: none; background-color: #f0f4f8; padding: 6px 12px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,123,255,0.15); display: flex; align-items: center;">
                <img src="images/create-icon.png" alt="Create" style="width: 22px; height: 22px; display: block;">
            </a>

            <a href="profile.html" title="Profile" style="text-decoration: none; padding: 6px 12px; display: flex; align-items: center;">
                <img src="images/profile-icon.png" alt="Profile" style="width: 22px; height: 22px; display: block; opacity: 0.6;">
            </a>

        </div>

    </div>


<!-- Publish memes using Cloudinary and Firebase -->
<script type="module">
    import { getCurrentUser } from "./auth.js";
    import { uploadMemeImage } from "./cloudinary-service.js";
    import { createMeme } from "./meme-service.js";

    const uploadForm = document.getElementById("uploadForm");
    const publishButton = uploadForm.querySelector('button[type="submit"]');

    // Display validation errors and publishing status.
    function setUploadStatus(message, type = "error") {
        const status = document.getElementById("uploadStatus");

        status.textContent = message;
        status.style.color =
            type === "success" ? "#15803d" :
            type === "loading" ? "#6D28D9" : "#b91c1c";

        status.style.display = message ? "block" : "none";
    }

    uploadForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        setUploadStatus("");

        const title = document.getElementById("memeTitle").value.trim();
        const courseTag = document.getElementById("memeCourse").value.trim();
        const description = document.getElementById("memeDesc").value.trim();
        const imageFile = document.getElementById("memeImage").files[0];

        // Title and course tag are required.
        if (!title || !courseTag) {
            setUploadStatus("Please enter a valid title and course tag.");
            return;
        }

        // A meme image is required.
        if (!imageFile) {
            setUploadStatus("Please select a meme image.");
            return;
        }

        // Allow only PNG and JPG images.
        if (!["image/png", "image/jpeg"].includes(imageFile.type)) {
            setUploadStatus("Only PNG and JPG images are allowed.");
            return;
        }

        // Reject images larger than 5MB.
        if (imageFile.size > 5 * 1024 * 1024) {
            setUploadStatus("Image size must not exceed 5MB.");
            return;
        }

        publishButton.disabled = true;

        try {
            // Verify that the student is logged in.
            const user = await getCurrentUser();

            if (!user) {
                throw new Error("Please log in before publishing.");
            }

            // Upload the image to Cloudinary.
            setUploadStatus("Uploading image...", "loading");
            const { imageUrl } = await uploadMemeImage(imageFile);

            // Save the meme details in Firestore.
            setUploadStatus("Publishing your meme...", "loading");

            await createMeme({
                title,
                description,
                courseTag,
                imageUrl
            });

            setUploadStatus("Meme published successfully!", "success");

            // Open My Posts to view the published meme.
            window.location.href = "myposts.html";

        } catch (error) {
            console.error("Failed to publish meme:", error);

            setUploadStatus(
                error.message || "Unable to publish. Please try again."
            );
        } finally {
            publishButton.disabled = false;
        }
    });
</script>

    <!-- Firebase Authentication Guard -->
    <script type="module" src="auth.js"></script>

</body>
</html>
