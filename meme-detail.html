<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeMory - Meme Details</title>
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="details-page" data-protected="true">
    <div class="app-container details-shell">
        <main class="details-main">
            <header class="details-header">
                <a href="home.html" class="details-back">&larr; Back</a>
                <h1>Meme Details</h1>
                <span class="details-header-spacer" aria-hidden="true"></span>
            </header>

            <div id="detailStatus" class="feed-status" role="status" aria-live="polite">
                <span class="loading-spinner" aria-hidden="true"></span>
                <span id="detailStatusText">Loading meme details...</span>
            </div>

            <article id="memeDetails" class="meme-details-card" hidden>
                <div class="details-card-header">
                    <div class="details-author-block">
                        <span id="detailAuthor" class="meme-author"></span>
                        <span id="detailCourseTag" class="meme-course-tag"></span>
                    </div>

                    <div class="meme-card-actions">
                        <button id="detailFavoriteButton" type="button" class="meme-action-button" data-action="favorite" title="Add to favorites" aria-label="Add to favorites">
                            <img src="images/like-icon.png" alt="">
                        </button>
                        <button id="detailReportButton" type="button" class="meme-action-button" data-action="report" title="Report meme" aria-label="Report meme">
                            <img src="images/flag-icon.png" alt="">
                        </button>
                    </div>
                </div>

                <h2 id="detailTitle" class="details-title"></h2>

                <div class="details-image-wrap">
                    <img id="detailImage" class="details-image" alt="" loading="eager" fetchpriority="high" decoding="async">
                </div>

                <section class="details-description" aria-labelledby="descriptionHeading">
                    <h3 id="descriptionHeading">Full Study Description</h3>
                    <p id="detailDescription"></p>
                </section>

                <p id="detailDate" class="details-date"></p>
            </article>
        </main>

        <nav class="bottom-navbar feed-navbar" aria-label="Main navigation">
            <a href="home.html" class="nav-link" title="Home">
                <img src="images/home-icon.png" alt="Home">
            </a>
            <a href="upload.html" class="nav-link" title="Create">
                <img src="images/create-icon.png" alt="Create">
            </a>
            <a href="profile.html" class="nav-link" title="Profile">
                <img src="images/profile-icon.png" alt="Profile">
            </a>
        </nav>
    </div>

    <script type="module" src="feed.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
