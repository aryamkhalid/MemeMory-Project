
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeMory - Home</title>
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Keep the Home navigation fixed at the bottom */
        .app-container.feed-shell {
            min-height: 100vh;
            min-height: 100dvh;
            justify-content: flex-start;
            padding-bottom: 85px;
        }

        .feed-navbar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 485px;
            margin-top: 0;
            padding: 12px 15px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background-color: #ffffff;
            border-top: 1px solid #cccccc;
            z-index: 100;
        }
    </style>
</head>

<body class="feed-page" data-protected="true">
    <div class="app-container feed-shell">
        <main class="feed-main" aria-labelledby="feedHeading">
            <header class="feed-header">
                <a href="home.html" class="feed-logo-link" aria-label="MemeMory home">
                    <img src="images/logo.png" alt="MemeMory" class="feed-logo">
                </a>

                <h1 id="feedHeading" class="visually-hidden">MemeMory Home Feed</h1>

                <div class="feed-search-controls">
                    <label for="searchInput" class="visually-hidden">Search memes</label>
                    <input id="searchInput" type="search" placeholder="Search course or keyword..." autocomplete="off" class="feed-search-input">

                    <label for="courseFilter" class="visually-hidden">Filter by course</label>
                    <select id="courseFilter" class="feed-course-filter">
                        <option value="">All courses</option>
                    </select>
                </div>
            </header>

            <p id="searchResultsSummary" class="search-results-summary" aria-live="polite"></p>

            <div id="feedStatus" class="feed-status" role="status" aria-live="polite">
                <span class="loading-spinner" aria-hidden="true"></span>
                <span id="feedStatusText">Loading memes...</span>
            </div>

            <div id="memesContainer" class="memes-container" aria-live="polite"></div>
        </main>

        <nav class="bottom-navbar feed-navbar" aria-label="Main navigation">
            <a href="home.html" class="nav-link active" aria-current="page" title="Home">
                <img src="images/home-icon.png" alt="Home">
            </a>
            <a href="upload.html" class="nav-link" title="Create">
                <img src="images/create-icon.png" alt="Create">
            </a>
            <a href="profile.html" class="nav-link" title="Profile">
                <img src="images/profile-icon.png" alt="Profile">
            </a>
        </nav>
    </div>

    <script type="module" src="feed.js"></script>
    <script type="module" src="search.js"></script>
    <script type="module" src="auth.js"></script>
    <script type="module" src="favorites.js"></script>
    <script type="module" src="reports.js"></script>
</body>
</html>
